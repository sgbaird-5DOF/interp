name: Generate Test Artifacts on GitHub-Hosted Runner
on: [push]
jobs:
  my-job:
    name: Run MATLAB Tests and Generate Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # v2 actions license MATLAB for free in public repositories; the v1
      # actions failed with License Manager Error 4410 (EntitlementNotFound).
      # v2 installs only base MATLAB unless toolboxes are listed: fitrgp()
      # in interp5DOF.m needs Statistics and Machine Learning Toolbox.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Run tests and generate artifacts
        uses: matlab-actions/run-tests@v2
        with:
          # Adds code/ and its subfolders to the path for the test session
          # (the old separate addpath step ran in its own session, so it
          # never carried over).
          source-folder: code
          select-by-folder: code
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml
